# Supervisor configuration for LEGOFIT website
# Handles both Flask and Dash servers for 25-30 concurrent users

[program:legofit-flask]
command=/root/legofit-website/venv/bin/gunicorn --bind 0.0.0.0:8050 --workers 3 --worker-class sync --worker-connections 1000 --timeout 120 --keepalive 5 --max-requests 1000 --max-requests-jitter 50 --preload-app main:server
directory=/root/legofit-website
user=root
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/legofit-flask.err.log
stdout_logfile=/var/log/legofit-flask.out.log
environment=PRODUCTION=true,BASE_URL="https://renovation.legofit.eu"

[program:legofit-dash]
command=/root/legofit-website/venv/bin/python dash_app.py
directory=/root/legofit-website
user=root
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/legofit-dash.err.log
stdout_logfile=/var/log/legofit-dash.out.log
environment=PRODUCTION=true,BASE_URL="https://renovation.legofit.eu",DASH_PORT=8051

# Optional: Redis for caching (if you want to add caching later)
[program:redis]
command=/usr/bin/redis-server /etc/redis/redis.conf
directory=/var/lib/redis
user=redis
autostart=false
autorestart=true
startretries=3
stderr_logfile=/var/log/redis.err.log
stdout_logfile=/var/log/redis.out.log

# Optional: Nginx (if you want supervisor to manage it)
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
directory=/etc/nginx
user=root
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/nginx.err.log
stdout_logfile=/var/log/nginx.out.log
