# Redirect old domain to new domain
# Place this file: /etc/nginx/sites-available/legofit-explorer-redirect.conf

server {
    listen 80;
    server_name legofit-explorer.com www.legofit-explorer.com;
    
    # Permanent redirect to new domain
    return 301 https://renovation.legofit.eu$request_uri;
}

server {
    listen 443 ssl;
    server_name legofit-explorer.com www.legofit-explorer.com;
    
    # SSL certificate (if you have one for old domain)
    # If not, remove this server block and only use the HTTP redirect above
    ssl_certificate /etc/letsencrypt/live/legofit-explorer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legofit-explorer.com/privkey.pem;
    
    # Permanent redirect to new domain
    return 301 https://renovation.legofit.eu$request_uri;
}

